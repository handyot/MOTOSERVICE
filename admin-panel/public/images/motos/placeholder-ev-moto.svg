<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Fondo neutro suave -->
  <rect width="400" height="300" rx="16" fill="#F8FAFC" />
  <rect x="1" y="1" width="398" height="298" rx="15" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Patrón de rejilla sutil de fondo técnico -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EDF2F7" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)" rx="16" />

  <!-- Silueta vectorial de moto scooter eléctrica -->
  <g transform="translate(115, 60)" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rueda trasera -->
    <circle cx="25" cy="100" r="22" fill="#FFFFFF" stroke="#64748B" stroke-width="3.5" />
    <circle cx="25" cy="100" r="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />
    <!-- Motor HUB trasero (icono EV) -->
    <circle cx="25" cy="100" r="4" fill="#2563EB" stroke="none" />

    <!-- Rueda delantera -->
    <circle cx="145" cy="100" r="22" fill="#FFFFFF" stroke="#64748B" stroke-width="3.5" />
    <circle cx="145" cy="100" r="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />

    <!-- Chasis y horquilla -->
    <path d="M 25 100 L 55 75 L 105 75 L 138 25 L 145 100" fill="none" />
    <!-- Manillar -->
    <path d="M 130 20 L 146 25 L 140 35" fill="none" stroke="#475569" stroke-width="3.5" />
    <!-- Plataforma y asiento -->
    <path d="M 50 65 C 50 55, 65 55, 80 58 L 85 75 Z" fill="#E2E8F0" stroke="#64748B" stroke-width="2.5" />
    <!-- Batería bajo plataforma -->
    <rect x="58" y="78" width="42" height="14" rx="3" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" />
    <!-- Rayo dentro de batería -->
    <path d="M 78 81 L 81 87 L 77 87 L 80 91" stroke="#2563EB" stroke-width="2" fill="none" />
  </g>

  <!-- Placa / Badge "Fotografía en homologación" -->
  <g transform="translate(200, 225)">
    <!-- Contenedor del badge -->
    <rect x="-120" y="0" width="240" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.05))" />

    <!-- Icono de cámara / lente con destello -->
    <g transform="translate(-105, 7)" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 2 4 L 4 1 L 10 1 L 12 4 L 14 4 A 2 2 0 0 1 16 6 L 16 11 A 2 2 0 0 1 14 13 L 2 13 A 2 2 0 0 1 0 11 L 0 6 A 2 2 0 0 1 2 4 Z" />
      <circle cx="8" cy="8.5" r="3" />
    </g>

    <!-- Texto descriptivo -->
    <text x="-80" y="18" fill="#475569" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.3">
      Fotografía en homologación
    </text>
  </g>

  <!-- Micro-subtítulo técnico -->
  <text x="200" y="270" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">
    Ficha de compatibilidad y especificaciones activa
  </text>
</svg>
